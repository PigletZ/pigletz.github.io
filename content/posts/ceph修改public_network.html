<h3 id="获取mon-map"><a href="#获取mon-map" class="headerlink" title="获取mon map"></a>获取mon map</h3><figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">ceph mon getmap -o monmap</span><br></pre></td></tr></table></figure>

<p>查看mon map：</p>
<figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br></pre></td><td class="code"><pre><span class="line">root@xjcc-1-80:~&#x2F;piglet&#x2F;mon# monmaptool --print monmap </span><br><span class="line">monmaptool: monmap file monmap</span><br><span class="line">epoch 3</span><br><span class="line">fsid 977b0814-6472-45ec-9d89-914c6cf0daf7</span><br><span class="line">last_changed 2020-11-19T15:10:24.859843+0800</span><br><span class="line">created 2020-11-19T02:34:26.993044+0800</span><br><span class="line">min_mon_release 15 (octopus)</span><br><span class="line">0: [v2:10.99.80.1:3300&#x2F;0,v1:10.99.80.1:6789&#x2F;0] mon.xjcc-1-80</span><br><span class="line">1: [v2:10.99.80.2:3300&#x2F;0,v1:10.99.80.2:6789&#x2F;0] mon.xjcc-2-80</span><br><span class="line">2: [v2:10.99.80.3:3300&#x2F;0,v1:10.99.80.3:6789&#x2F;0] mon.xjcc-3-80</span><br></pre></td></tr></table></figure>

<h3 id="删除旧的map配置，添加新的map"><a href="#删除旧的map配置，添加新的map" class="headerlink" title="删除旧的map配置，添加新的map"></a>删除旧的map配置，添加新的map</h3><p>修改前，先保存一份用于备份恢复</p>
<figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br></pre></td><td class="code"><pre><span class="line">monmaptool --rm ｛nodename｝ --rm &#123;nodename&#125; --rm &#123;nodename&#125; monmap</span><br><span class="line"></span><br><span class="line">添加新ip配置：</span><br><span class="line">monmaptool --add &#123;nodename&#125; &#123;ip&#125;:6789 --add &#123;nodename&#125; &#123;ip&#125;:6789 --add &#123;nodename&#125; &#123;ip&#125;:6789 monmap</span><br><span class="line"></span><br><span class="line">查看修改后的monmap：</span><br><span class="line">root@xjcc-1-80:~&#x2F;piglet# monmaptool --print monmap </span><br><span class="line">monmaptool: monmap file monmap</span><br><span class="line">epoch 3</span><br><span class="line">fsid 977b0814-6472-45ec-9d89-914c6cf0daf7</span><br><span class="line">last_changed 2020-11-19T15:10:24.859843+0800</span><br><span class="line">created 2020-11-19T02:34:26.993044+0800</span><br><span class="line">min_mon_release 15 (octopus)</span><br><span class="line">0: v1:10.100.80.1:6789&#x2F;0 mon.xjcc-1-80</span><br><span class="line">1: v1:10.100.80.2:6789&#x2F;0 mon.xjcc-2-80</span><br><span class="line">2: v1:10.100.80.3:6789&#x2F;0 mon.xjcc-3-80</span><br></pre></td></tr></table></figure>



<h3 id="注入前预处理"><a href="#注入前预处理" class="headerlink" title="注入前预处理"></a>注入前预处理</h3><p>（1）修改ceph.conf 中的ip地址为新的ip地址，并将配置文件更新至所有节点，monmap拷贝至mon节点即可</p>
<figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><span class="line">vi &#x2F;etc&#x2F;ceph&#x2F;ceph.conf</span><br><span class="line">mon_host &#x3D; ip1,ip2,ip3</span><br><span class="line">public_network &#x3D; 10.100.64.0&#x2F;18</span><br><span class="line"></span><br><span class="line">----------------------------</span><br><span class="line"></span><br><span class="line">更新ceph.conf至所有节点</span><br><span class="line">scp &#x2F;etc&#x2F;ceph&#x2F;ceph.conf root@&#123;nodename&#125;:&#x2F;etc&#x2F;ceph&#x2F;</span><br><span class="line"></span><br><span class="line">拷贝monmap至所有mon节点，以备后续的注入</span><br><span class="line">scp monmap root@&#123;nodename&#125;:&#x2F;root</span><br></pre></td></tr></table></figure>


<p>（2）将集群设置noout，防止重启osd，重平衡带来的负载，若有recover，尽量等recover修复好再进行操作，防止osd拉不起或者损坏带来的数据丢失。</p>
<figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">ceph osd set noout</span><br></pre></td></tr></table></figure>

<p>（3）停止所有的mon服务</p>
<figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">去各自的mon节点执行停止服务</span><br><span class="line">systemctl stop ceph-mon@&#123;nodename&#125;</span><br></pre></td></tr></table></figure>

<h3 id="注入新的monmap"><a href="#注入新的monmap" class="headerlink" title="注入新的monmap"></a>注入新的monmap</h3><figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br></pre></td><td class="code"><pre><span class="line">去到各自的mon节点，执行</span><br><span class="line"></span><br><span class="line">ceph-mon -i &#123;nodename&#125; --inject-monmap &#x2F;root&#x2F;monmap</span><br><span class="line"></span><br><span class="line">查看修改后的mon状态：</span><br><span class="line">root@xjcc-1-80:~&#x2F;piglet# ceph mon stat</span><br><span class="line">e5: 3 mons at&#123;</span><br><span class="line">xjcc-1-80&#x3D;[v2:10.100.80.1:3300&#x2F;0,v1:10.100.80.1:6789&#x2F;0],</span><br><span class="line">xjcc-2-80&#x3D;[v2:10.100.80.2:3300&#x2F;0,v1:10.100.80.2:6789&#x2F;0],</span><br><span class="line">xjcc-3-80&#x3D;[v2:10.100.80.3:3300&#x2F;0,v1:10.100.80.3:6789&#x2F;0]&#125;, </span><br><span class="line">election epoch 72, leader 0 xjcc-1-80, quorum 0,1,2 xjcc-1-80,xjcc-2-80,xjcc-3-80</span><br></pre></td></tr></table></figure>

<h3 id="重启所有服务"><a href="#重启所有服务" class="headerlink" title="重启所有服务"></a>重启所有服务</h3><figure class="highlight plain"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br></pre></td><td class="code"><pre><span class="line">重启每个节点对应角色的target服务，如osd节点：</span><br><span class="line">systemctl restart ceph-osd.target</span><br></pre></td></tr></table></figure>
